<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR X-Ray Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --orange: #FF6B1A;
    --orange-hover: #ff7d33;
    --bg: #ffffff;
    --bg-soft: #f5f5f7;
    --text: #1d1d1f;
    --text-dim: #86868b;
    --separator: rgba(0,0,0,0.08);
    --glass: rgba(255,255,255,0.72);
    --glass-strong: rgba(255,255,255,0.88);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    letter-spacing: -0.01em;
  }

  #setup-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 24px;
    padding: 32px 24px;
    background: var(--bg);
  }

  .logo {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--orange);
    text-transform: uppercase;
  }

  h1 {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.025em;
    text-align: center;
    line-height: 1.1;
    color: var(--text);
  }

  h1 span { color: var(--orange); }

  .subtitle {
    font-size: 15px;
    color: var(--text-dim);
    text-align: center;
    max-width: 320px;
    line-height: 1.45;
    font-weight: 400;
    margin-bottom: 8px;
  }

  .upload-zone {
    width: 100%;
    max-width: 340px;
    border: 1.5px dashed rgba(0,0,0,0.15);
    border-radius: 14px;
    padding: 28px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
    background: var(--bg-soft);
  }

  .upload-zone:hover, .upload-zone:active {
    border-color: var(--orange);
    background: rgba(255,107,26,0.04);
  }

  .upload-zone input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .upload-icon {
    font-size: 28px;
    margin-bottom: 10px;
    display: block;
  }

  .upload-zone p {
    font-size: 14px;
    color: var(--text-dim);
    font-weight: 500;
  }

  .upload-zone .filename {
    margin-top: 8px;
    font-size: 12px;
    color: var(--orange);
    font-weight: 500;
    display: none;
  }

  .controls-row {
    display: flex;
    gap: 14px;
    width: 100%;
    max-width: 340px;
  }

  .control-group {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--bg-soft);
    border-radius: 12px;
    padding: 12px 14px;
  }

  .control-group .label-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .control-group label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: none;
    letter-spacing: 0;
  }

  .control-group .val {
    font-size: 13px;
    color: var(--text);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* Apple-style range slider */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(0,0,0,0.12);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2), 0 0 0 0.5px rgba(0,0,0,0.04);
    cursor: pointer;
    transition: transform 0.1s;
  }
  input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.1); }
  input[type="range"]::-moz-range-thumb {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #fff;
    border: none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    cursor: pointer;
  }

  .start-btn {
    width: 100%;
    max-width: 340px;
    padding: 15px;
    background: var(--orange);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, opacity 0.2s;
    opacity: 0.35;
    pointer-events: none;
    box-shadow: var(--shadow-sm);
    margin-top: 8px;
  }

  .start-btn.ready {
    opacity: 1;
    pointer-events: all;
  }
  .start-btn.ready:hover { background: var(--orange-hover); }
  .start-btn.ready:active { transform: scale(0.98); }

  /* AR SCREEN */
  #ar-screen {
    display: none;
    position: relative;
    width: 100%;
    height: 100vh;
    background: #000;
  }

  #video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* HUD */
  .hud-top {
    position: absolute;
    top: env(safe-area-inset-top, 12px); left: 12px; right: 12px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--glass);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-radius: 14px;
    box-shadow: var(--shadow-md);
    z-index: 10;
  }

  .hud-logo {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--orange);
    text-transform: uppercase;
  }

  .status-badge {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0;
    padding: 4px 10px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .status-badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .status-badge.searching {
    color: var(--text-dim);
    background: rgba(0,0,0,0.05);
    animation: pulse 1.5s ease-in-out infinite;
  }

  .status-badge.locked {
    color: var(--orange);
    background: rgba(255,107,26,0.12);
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }

  .hud-controls {
    position: absolute;
    top: calc(env(safe-area-inset-top, 12px) + 60px);
    left: 12px; right: 12px;
    padding: 14px 16px;
    background: var(--glass);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-radius: 14px;
    box-shadow: var(--shadow-md);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .slider-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .slider-wrap label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
  }
  .slider-wrap label span {
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .back-btn {
    padding: 8px 14px;
    background: rgba(0,0,0,0.06);
    border: none;
    color: var(--text);
    border-radius: 999px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .back-btn:hover { background: rgba(0,0,0,0.1); }
  .back-btn:active { background: rgba(0,0,0,0.14); }

  /* Crosshair */
  .crosshair {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 56px; height: 56px;
    pointer-events: none;
    z-index: 5;
    opacity: 0.6;
  }

  .crosshair::before, .crosshair::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.85);
  }

  .crosshair::before {
    width: 1px; height: 100%;
    left: 50%; top: 0;
  }

  .crosshair::after {
    width: 100%; height: 1px;
    top: 50%; left: 0;
  }

  .corner-tl, .corner-tr, .corner-bl, .corner-br {
    position: absolute;
    width: 10px; height: 10px;
    border-color: rgba(255,255,255,0.9);
    border-style: solid;
  }
  .corner-tl { top: 0; left: 0; border-width: 1.5px 0 0 1.5px; }
  .corner-tr { top: 0; right: 0; border-width: 1.5px 1.5px 0 0; }
  .corner-bl { bottom: 0; left: 0; border-width: 0 0 1.5px 1.5px; }
  .corner-br { bottom: 0; right: 0; border-width: 0 1.5px 1.5px 0; }
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup-screen">
  <div class="logo">Radii-X // AR Viewer</div>
  <h1>X-Ray<br><span>AR Overlay</span></h1>
  <p class="subtitle">Load an X-ray image, point camera at QR code on slab — image appears in place.</p>

  <div class="upload-zone" id="upload-zone">
    <input type="file" id="file-input" accept="image/*">
    <svg class="upload-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="color: #86868b; margin-bottom: 8px;">
      <path d="M12 16V4m0 0l-4 4m4-4l4 4"></path>
      <path d="M20 16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2"></path>
    </svg>
    <p>Tap to load X-ray image</p>
    <div class="filename" id="filename"></div>
  </div>

  <div class="controls-row">
    <div class="control-group">
      <div class="label-row">
        <label>Scale</label>
        <span class="val" id="scale-val">3×</span>
      </div>
      <input type="range" id="scale-setup" min="1" max="5" value="3" step="0.1">
    </div>
    <div class="control-group">
      <div class="label-row">
        <label>Opacity</label>
        <span class="val" id="opacity-val">90%</span>
      </div>
      <input type="range" id="opacity-setup" min="10" max="100" value="90" step="5">
    </div>
  </div>

  <button class="start-btn" id="start-btn">Start AR Camera</button>
</div>

<!-- AR VIEW -->
<div id="ar-screen">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="hud-top">
    <div class="hud-logo">Radii-X</div>
    <div class="status-badge searching" id="status">Searching</div>
  </div>

  <div class="crosshair">
    <div class="corner-tl"></div>
    <div class="corner-tr"></div>
    <div class="corner-bl"></div>
    <div class="corner-br"></div>
  </div>

  <div class="hud-controls">
    <div class="slider-wrap">
      <label>Scale <span id="scale-live">3×</span></label>
      <input type="range" id="scale-ar" min="1" max="5" value="3" step="0.1">
    </div>
    <div class="slider-wrap">
      <label>Opacity <span id="opacity-live">90%</span></label>
      <input type="range" id="opacity-ar" min="10" max="100" value="90" step="5">
    </div>
    <button class="back-btn" id="back-btn">Done</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
  const fileInput = document.getElementById('file-input');
  const startBtn = document.getElementById('start-btn');
  const filenameEl = document.getElementById('filename');
  const setupScreen = document.getElementById('setup-screen');
  const arScreen = document.getElementById('ar-screen');
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const backBtn = document.getElementById('back-btn');

  let xrayImage = null;
  const DEFAULT_XRAY_URL = 'xray-default.jpg';
  let scaleFactor = 3;
  let overlayOpacity = 0.90;
  let animFrame = null;
  let lastQR = null;
  let smoothPos = null;
  const SMOOTH = 0.08;            // smaller = steadier (heavier smoothing)
  const DEAD_XY = 2.5;            // px — ignore tiny position jitter
  const DEAD_SIZE = 3;            // px — ignore tiny size jitter
  const DEAD_ANGLE = 0.012;       // rad (~0.7°) — ignore tiny rotation jitter

  // Setup controls
  const scaleSetup = document.getElementById('scale-setup');
  const opacitySetup = document.getElementById('opacity-setup');
  const scaleVal = document.getElementById('scale-val');
  const opacityVal = document.getElementById('opacity-val');

  scaleSetup.oninput = () => {
    scaleFactor = parseFloat(scaleSetup.value);
    scaleVal.textContent = scaleFactor + '×';
    document.getElementById('scale-ar').value = scaleFactor;
    document.getElementById('scale-live').textContent = scaleFactor + '×';
  };
  opacitySetup.oninput = () => {
    overlayOpacity = parseInt(opacitySetup.value) / 100;
    opacityVal.textContent = opacitySetup.value + '%';
    document.getElementById('opacity-ar').value = opacitySetup.value;
    document.getElementById('opacity-live').textContent = opacitySetup.value + '%';
  };

  // AR controls
  document.getElementById('scale-ar').oninput = function() {
    scaleFactor = parseFloat(this.value);
    document.getElementById('scale-live').textContent = scaleFactor + '×';
    scaleSetup.value = scaleFactor;
    scaleVal.textContent = scaleFactor + '×';
  };
  document.getElementById('opacity-ar').oninput = function() {
    overlayOpacity = parseInt(this.value) / 100;
    document.getElementById('opacity-live').textContent = this.value + '%';
    opacitySetup.value = this.value;
    opacityVal.textContent = this.value + '%';
  };

  // Load default X-ray image so user can start AR without uploading
  (function loadDefaultXray() {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      if (!xrayImage) {
        xrayImage = img;
        filenameEl.textContent = 'Default X-ray (tap above to replace)';
        filenameEl.style.display = 'block';
        startBtn.classList.add('ready');
      }
    };
    img.src = DEFAULT_XRAY_URL;
  })();

  // File load — using createObjectURL (more reliable on iPhone Safari)
  fileInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;

    // Revoke previous URL if any
    if (xrayImage && xrayImage._objUrl) URL.revokeObjectURL(xrayImage._objUrl);

    const url = URL.createObjectURL(file);
    const img = new Image();

    img.onload = () => { xrayImage = img; };
    img.onerror = () => { URL.revokeObjectURL(url); alert('Could not load image. Please use a JPG or PNG file.'); };
    img.src = url;

    // Enable button immediately on file select
    filenameEl.textContent = file.name;
    filenameEl.style.display = 'block';
    startBtn.classList.add('ready');
  };

  // Start AR
  startBtn.onclick = async () => {
    if (!xrayImage) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
      });
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        setupScreen.style.display = 'none';
        arScreen.style.display = 'block';
        resizeCanvas();
        loop();
      };
    } catch(err) {
      alert('Camera access denied. Please allow camera permission and try again.');
    }
  };

  backBtn.onclick = () => {
    cancelAnimationFrame(animFrame);
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    arScreen.style.display = 'none';
    setupScreen.style.display = 'flex';
    smoothPos = null;
    lastQR = null;
  };

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.onresize = resizeCanvas;

  // Helper: distance between two points
  function dist(a, b) {
    return Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2);
  }

  // Helper: midpoint
  function mid(a, b) {
    return { x: (a.x+b.x)/2, y: (a.y+b.y)/2 };
  }

  // Map video coords to canvas coords
  function mapPoint(p, vw, vh, cw, ch) {
    return {
      x: (p.x / vw) * cw,
      y: (p.y / vh) * ch
    };
  }

  let offscreen = document.createElement('canvas');
  let offCtx = offscreen.getContext('2d');

  function loop() {
    animFrame = requestAnimationFrame(loop);
    if (video.readyState < 2) return;

    const vw = video.videoWidth;
    const vh = video.videoHeight;
    const cw = canvas.width;
    const ch = canvas.height;

    offscreen.width = vw;
    offscreen.height = vh;
    offCtx.drawImage(video, 0, 0, vw, vh);

    const imageData = offCtx.getImageData(0, 0, vw, vh);
    const qr = jsQR(imageData.data, vw, vh, { inversionAttempts: 'dontInvert' });

    ctx.clearRect(0, 0, cw, ch);

    if (qr) {
      lastQR = qr;
      statusEl.textContent = 'Locked';
      statusEl.className = 'status-badge locked';

      const tl = mapPoint(qr.location.topLeftCorner, vw, vh, cw, ch);
      const tr = mapPoint(qr.location.topRightCorner, vw, vh, cw, ch);
      const br = mapPoint(qr.location.bottomRightCorner, vw, vh, cw, ch);
      const bl = mapPoint(qr.location.bottomLeftCorner, vw, vh, cw, ch);

      const center = mid(mid(tl, br), mid(tr, bl));
      const qrSize = (dist(tl, tr) + dist(bl, br)) / 2;
      const imgSize = qrSize * scaleFactor;

      // Rotation angle
      const angle = Math.atan2(tr.y - tl.y, tr.x - tl.x);

      // Smooth position with deadzone to eliminate micro-jitter
      const target = { x: center.x, y: center.y, size: imgSize, angle };
      if (!smoothPos) {
        smoothPos = { ...target };
      } else {
        const dx = target.x - smoothPos.x;
        const dy = target.y - smoothPos.y;
        const ds = target.size - smoothPos.size;
        let da = target.angle - smoothPos.angle;
        // unwrap angle delta to shortest path
        while (da >  Math.PI) da -= 2 * Math.PI;
        while (da < -Math.PI) da += 2 * Math.PI;

        if (Math.hypot(dx, dy) > DEAD_XY) {
          smoothPos.x += dx * SMOOTH;
          smoothPos.y += dy * SMOOTH;
        }
        if (Math.abs(ds) > DEAD_SIZE) {
          smoothPos.size += ds * SMOOTH;
        }
        if (Math.abs(da) > DEAD_ANGLE) {
          smoothPos.angle += da * SMOOTH;
        }
      }

      drawOverlay(smoothPos);
      drawQRCorners(tl, tr, br, bl);

    } else {
      // Keep last position fading
      if (smoothPos) {
        statusEl.textContent = 'Searching';
        statusEl.className = 'status-badge searching';
        drawOverlay(smoothPos);
      } else {
        statusEl.textContent = 'Searching';
        statusEl.className = 'status-badge searching';
      }
    }
  }

  function drawOverlay(pos) {
    if (!xrayImage || !pos) return;
    const imgAspect = xrayImage.width / xrayImage.height;
    const drawW = pos.size;
    const drawH = drawW / imgAspect;

    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.rotate(pos.angle);
    ctx.globalAlpha = overlayOpacity;

    // Slight green tint for X-ray feel
    ctx.filter = 'saturate(0.3) brightness(1.1)';
    ctx.drawImage(xrayImage, -drawW/2, -drawH/2, drawW, drawH);
    ctx.filter = 'none';

    // Border
    ctx.globalAlpha = Math.min(overlayOpacity + 0.2, 1);
    ctx.strokeStyle = '#FF6B1A';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-drawW/2, -drawH/2, drawW, drawH);

    ctx.restore();
  }

  function drawQRCorners(tl, tr, br, bl) {
    const size = 12;
    ctx.strokeStyle = '#FF6B1A';
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.9;

    function corner(p, dx1, dy1, dx2, dy2) {
      ctx.beginPath();
      ctx.moveTo(p.x + dx1 * size, p.y + dy1 * size);
      ctx.lineTo(p.x, p.y);
      ctx.lineTo(p.x + dx2 * size, p.y + dy2 * size);
      ctx.stroke();
    }
    corner(tl, 1, 0, 0, 1);
    corner(tr, -1, 0, 0, 1);
    corner(br, -1, 0, 0, -1);
    corner(bl, 1, 0, 0, -1);
    ctx.globalAlpha = 1;
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR X-Ray Viewer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --orange: #FF6B1A;
    --dark: #0a0a0a;
    --panel: rgba(10,10,10,0.85);
    --border: rgba(255,107,26,0.3);
    --text: #e0e0e0;
    --dim: #666;
  }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  #setup-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 32px;
    padding: 24px;
    background: linear-gradient(160deg, #0a0a0a 60%, #1a0d00 100%);
  }

  .logo {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--orange);
    text-transform: uppercase;
    opacity: 0.7;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    text-align: center;
    line-height: 1.2;
  }

  h1 span { color: var(--orange); }

  .subtitle {
    font-size: 13px;
    color: var(--dim);
    text-align: center;
    max-width: 280px;
    line-height: 1.6;
    font-weight: 300;
  }

  .upload-zone {
    width: 100%;
    max-width: 320px;
    border: 1px dashed var(--border);
    border-radius: 4px;
    padding: 28px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    background: rgba(255,107,26,0.03);
  }

  .upload-zone:hover {
    border-color: var(--orange);
    background: rgba(255,107,26,0.06);
  }

  .upload-zone input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .upload-icon {
    font-size: 32px;
    margin-bottom: 10px;
    display: block;
  }

  .upload-zone p {
    font-size: 13px;
    color: var(--dim);
    font-weight: 300;
  }

  .upload-zone .filename {
    margin-top: 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--orange);
    display: none;
  }

  .controls-row {
    display: flex;
    gap: 16px;
    width: 100%;
    max-width: 320px;
  }

  .control-group {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .control-group label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--dim);
    font-family: 'Share Tech Mono', monospace;
  }

  .control-group input[type="range"] {
    width: 100%;
    accent-color: var(--orange);
    cursor: pointer;
  }

  .control-group .val {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--orange);
    text-align: right;
  }

  .start-btn {
    width: 100%;
    max-width: 320px;
    padding: 16px;
    background: var(--orange);
    color: #000;
    border: none;
    border-radius: 3px;
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    opacity: 0.4;
    pointer-events: none;
  }

  .start-btn.ready {
    opacity: 1;
    pointer-events: all;
  }

  .start-btn.ready:hover {
    background: #ff8c45;
  }

  /* AR SCREEN */
  #ar-screen {
    display: none;
    position: relative;
    width: 100%;
    height: 100vh;
    background: #000;
  }

  #video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* HUD */
  .hud-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    z-index: 10;
  }

  .hud-logo {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--orange);
    opacity: 0.8;
  }

  .status-badge {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    padding: 5px 10px;
    border-radius: 2px;
    border: 1px solid currentColor;
    text-transform: uppercase;
  }

  .status-badge.searching {
    color: var(--dim);
    border-color: var(--dim);
    animation: pulse 1.5s ease-in-out infinite;
  }

  .status-badge.locked {
    color: var(--orange);
    border-color: var(--orange);
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .hud-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 20px;
    background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    z-index: 10;
    display: flex;
    align-items: flex-end;
    gap: 16px;
  }

  .slider-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .slider-wrap label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--dim);
    text-transform: uppercase;
  }

  .slider-wrap input[type="range"] {
    width: 100%;
    accent-color: var(--orange);
  }

  .back-btn {
    padding: 10px 16px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--text);
    border-radius: 3px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    cursor: pointer;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* Crosshair */
  .crosshair {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 60px; height: 60px;
    pointer-events: none;
    z-index: 5;
  }

  .crosshair::before, .crosshair::after {
    content: '';
    position: absolute;
    background: rgba(255,107,26,0.5);
  }

  .crosshair::before {
    width: 1px; height: 100%;
    left: 50%; top: 0;
  }

  .crosshair::after {
    width: 100%; height: 1px;
    top: 50%; left: 0;
  }

  .corner-tl, .corner-tr, .corner-bl, .corner-br {
    position: absolute;
    width: 12px; height: 12px;
    border-color: var(--orange);
    border-style: solid;
    opacity: 0.7;
  }
  .corner-tl { top: 0; left: 0; border-width: 2px 0 0 2px; }
  .corner-tr { top: 0; right: 0; border-width: 2px 2px 0 0; }
  .corner-bl { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
  .corner-br { bottom: 0; right: 0; border-width: 0 2px 2px 0; }
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup-screen">
  <div class="logo">Radii-X // AR Viewer</div>
  <h1>X-Ray<br><span>AR Overlay</span></h1>
  <p class="subtitle">Load an X-ray image, point camera at QR code on slab — image appears in place.</p>

  <div class="upload-zone" id="upload-zone">
    <input type="file" id="file-input" accept="image/*">
    <span class="upload-icon">📂</span>
    <p>Tap to load X-ray image</p>
    <div class="filename" id="filename"></div>
  </div>

  <div class="controls-row">
    <div class="control-group">
      <label>Image Scale</label>
      <input type="range" id="scale-setup" min="1" max="20" value="6" step="0.5">
      <div class="val" id="scale-val">6×</div>
    </div>
    <div class="control-group">
      <label>Opacity</label>
      <input type="range" id="opacity-setup" min="10" max="100" value="75" step="5">
      <div class="val" id="opacity-val">75%</div>
    </div>
  </div>

  <button class="start-btn" id="start-btn">Start AR Camera</button>
</div>

<!-- AR VIEW -->
<div id="ar-screen">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="hud-top">
    <div class="hud-logo">Radii-X AR</div>
    <div class="status-badge searching" id="status">Searching QR...</div>
  </div>

  <div class="crosshair">
    <div class="corner-tl"></div>
    <div class="corner-tr"></div>
    <div class="corner-bl"></div>
    <div class="corner-br"></div>
  </div>

  <div class="hud-bottom">
    <div class="slider-wrap">
      <label>Scale <span id="scale-live">6×</span></label>
      <input type="range" id="scale-ar" min="1" max="20" value="6" step="0.5">
    </div>
    <div class="slider-wrap">
      <label>Opacity <span id="opacity-live">75%</span></label>
      <input type="range" id="opacity-ar" min="10" max="100" value="75" step="5">
    </div>
    <button class="back-btn" id="back-btn">← Back</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
  const fileInput = document.getElementById('file-input');
  const startBtn = document.getElementById('start-btn');
  const filenameEl = document.getElementById('filename');
  const setupScreen = document.getElementById('setup-screen');
  const arScreen = document.getElementById('ar-screen');
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const backBtn = document.getElementById('back-btn');

  let xrayImage = null;
  const DEFAULT_XRAY_URL = 'xray-default.jpg';
  let scaleFactor = 6;
  let overlayOpacity = 0.75;
  let animFrame = null;
  let lastQR = null;
  let smoothPos = null;
  const SMOOTH = 0.25;

  // Setup controls
  const scaleSetup = document.getElementById('scale-setup');
  const opacitySetup = document.getElementById('opacity-setup');
  const scaleVal = document.getElementById('scale-val');
  const opacityVal = document.getElementById('opacity-val');

  scaleSetup.oninput = () => {
    scaleFactor = parseFloat(scaleSetup.value);
    scaleVal.textContent = scaleFactor + '×';
    document.getElementById('scale-ar').value = scaleFactor;
    document.getElementById('scale-live').textContent = scaleFactor + '×';
  };
  opacitySetup.oninput = () => {
    overlayOpacity = parseInt(opacitySetup.value) / 100;
    opacityVal.textContent = opacitySetup.value + '%';
    document.getElementById('opacity-ar').value = opacitySetup.value;
    document.getElementById('opacity-live').textContent = opacitySetup.value + '%';
  };

  // AR controls
  document.getElementById('scale-ar').oninput = function() {
    scaleFactor = parseFloat(this.value);
    document.getElementById('scale-live').textContent = scaleFactor + '×';
    scaleSetup.value = scaleFactor;
    scaleVal.textContent = scaleFactor + '×';
  };
  document.getElementById('opacity-ar').oninput = function() {
    overlayOpacity = parseInt(this.value) / 100;
    document.getElementById('opacity-live').textContent = this.value + '%';
    opacitySetup.value = this.value;
    opacityVal.textContent = this.value + '%';
  };

  // Load default X-ray image so user can start AR without uploading
  (function loadDefaultXray() {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      if (!xrayImage) {
        xrayImage = img;
        filenameEl.textContent = 'Default X-ray (tap above to replace)';
        filenameEl.style.display = 'block';
        startBtn.classList.add('ready');
      }
    };
    img.src = DEFAULT_XRAY_URL;
  })();

  // File load — using createObjectURL (more reliable on iPhone Safari)
  fileInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;

    // Revoke previous URL if any
    if (xrayImage && xrayImage._objUrl) URL.revokeObjectURL(xrayImage._objUrl);

    const url = URL.createObjectURL(file);
    const img = new Image();

    img.onload = () => { xrayImage = img; };
    img.onerror = () => { URL.revokeObjectURL(url); alert('Could not load image. Please use a JPG or PNG file.'); };
    img.src = url;

    // Enable button immediately on file select
    filenameEl.textContent = file.name;
    filenameEl.style.display = 'block';
    startBtn.classList.add('ready');
  };

  // Start AR
  startBtn.onclick = async () => {
    if (!xrayImage) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
      });
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        setupScreen.style.display = 'none';
        arScreen.style.display = 'block';
        resizeCanvas();
        loop();
      };
    } catch(err) {
      alert('Camera access denied. Please allow camera permission and try again.');
    }
  };

  backBtn.onclick = () => {
    cancelAnimationFrame(animFrame);
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    arScreen.style.display = 'none';
    setupScreen.style.display = 'flex';
    smoothPos = null;
    lastQR = null;
  };

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.onresize = resizeCanvas;

  // Helper: distance between two points
  function dist(a, b) {
    return Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2);
  }

  // Helper: midpoint
  function mid(a, b) {
    return { x: (a.x+b.x)/2, y: (a.y+b.y)/2 };
  }

  // Map video coords to canvas coords
  function mapPoint(p, vw, vh, cw, ch) {
    return {
      x: (p.x / vw) * cw,
      y: (p.y / vh) * ch
    };
  }

  let offscreen = document.createElement('canvas');
  let offCtx = offscreen.getContext('2d');

  function loop() {
    animFrame = requestAnimationFrame(loop);
    if (video.readyState < 2) return;

    const vw = video.videoWidth;
    const vh = video.videoHeight;
    const cw = canvas.width;
    const ch = canvas.height;

    offscreen.width = vw;
    offscreen.height = vh;
    offCtx.drawImage(video, 0, 0, vw, vh);

    const imageData = offCtx.getImageData(0, 0, vw, vh);
    const qr = jsQR(imageData.data, vw, vh, { inversionAttempts: 'dontInvert' });

    ctx.clearRect(0, 0, cw, ch);

    if (qr) {
      lastQR = qr;
      statusEl.textContent = 'QR LOCKED';
      statusEl.className = 'status-badge locked';

      const tl = mapPoint(qr.location.topLeftCorner, vw, vh, cw, ch);
      const tr = mapPoint(qr.location.topRightCorner, vw, vh, cw, ch);
      const br = mapPoint(qr.location.bottomRightCorner, vw, vh, cw, ch);
      const bl = mapPoint(qr.location.bottomLeftCorner, vw, vh, cw, ch);

      const center = mid(mid(tl, br), mid(tr, bl));
      const qrSize = (dist(tl, tr) + dist(bl, br)) / 2;
      const imgSize = qrSize * scaleFactor;

      // Rotation angle
      const angle = Math.atan2(tr.y - tl.y, tr.x - tl.x);

      // Smooth position
      const target = { x: center.x, y: center.y, size: imgSize, angle };
      if (!smoothPos) {
        smoothPos = { ...target };
      } else {
        smoothPos.x += (target.x - smoothPos.x) * SMOOTH;
        smoothPos.y += (target.y - smoothPos.y) * SMOOTH;
        smoothPos.size += (target.size - smoothPos.size) * SMOOTH;
        smoothPos.angle += (target.angle - smoothPos.angle) * SMOOTH;
      }

      drawOverlay(smoothPos);
      drawQRCorners(tl, tr, br, bl);

    } else {
      // Keep last position fading
      if (smoothPos) {
        statusEl.textContent = 'Searching QR...';
        statusEl.className = 'status-badge searching';
        drawOverlay(smoothPos);
      } else {
        statusEl.textContent = 'Searching QR...';
        statusEl.className = 'status-badge searching';
      }
    }
  }

  function drawOverlay(pos) {
    if (!xrayImage || !pos) return;
    const imgAspect = xrayImage.width / xrayImage.height;
    const drawW = pos.size;
    const drawH = drawW / imgAspect;

    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.rotate(pos.angle);
    ctx.globalAlpha = overlayOpacity;

    // Slight green tint for X-ray feel
    ctx.filter = 'saturate(0.3) brightness(1.1)';
    ctx.drawImage(xrayImage, -drawW/2, -drawH/2, drawW, drawH);
    ctx.filter = 'none';

    // Border
    ctx.globalAlpha = Math.min(overlayOpacity + 0.2, 1);
    ctx.strokeStyle = '#FF6B1A';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-drawW/2, -drawH/2, drawW, drawH);

    ctx.restore();
  }

  function drawQRCorners(tl, tr, br, bl) {
    const size = 12;
    ctx.strokeStyle = '#FF6B1A';
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.9;

    function corner(p, dx1, dy1, dx2, dy2) {
      ctx.beginPath();
      ctx.moveTo(p.x + dx1 * size, p.y + dy1 * size);
      ctx.lineTo(p.x, p.y);
      ctx.lineTo(p.x + dx2 * size, p.y + dy2 * size);
      ctx.stroke();
    }
    corner(tl, 1, 0, 0, 1);
    corner(tr, -1, 0, 0, 1);
    corner(br, -1, 0, 0, -1);
    corner(bl, 1, 0, 0, -1);
    ctx.globalAlpha = 1;
  }
</script>
</body>
</html>
